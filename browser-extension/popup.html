<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracking Threats</title>
    <style>
      body {
        width: 280px;
        margin: 0;
        max-height: 600px;
        overflow-y: auto;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #0f172a;
        background: #f8fafc;
      }

      main {
        padding: 14px;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 15px;
      }

      p {
        margin: 6px 0;
        font-size: 12px;
        line-height: 1.4;
        color: #475569;
      }

      .status {
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        background: #fff;
        padding: 10px;
      }

      .pill {
        display: inline-block;
        margin-top: 4px;
        border-radius: 999px;
        padding: 3px 8px;
        font-size: 11px;
        font-weight: 700;
        background: #ccfbf1;
        color: #115e59;
      }

      .error {
        background: #ffe4e6;
        color: #be123c;
      }

      .warning {
        background: #fef3c7;
        color: #92400e;
      }

      a {
        display: inline-block;
        margin-top: 12px;
        color: #0f766e;
        font-size: 12px;
        font-weight: 700;
        text-decoration: none;
      }

      button {
        width: 100%;
        margin-top: 12px;
        border: 0;
        border-radius: 8px;
        padding: 9px 10px;
        background: #0f766e;
        color: white;
        font-family: inherit;
        font-size: 12px;
        font-weight: 700;
        line-height: 1.2;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tracking Threats Monitor</h1>
      <div class="status">
        <p id="message">Waiting for browsing activity...</p>
        <span id="pill" class="pill">Ready</span>
      </div>
      <button id="inspectPage" type="button">Inspect this page</button>
      <p id="inspectionNote">Checks rendered forms and page signals only when you request it.</p>
      <a id="openApp" href="http://localhost:5173/" target="_blank">Open Tracking Threats</a>
    </main>
    <script src="config.js"></script>

    <div id="createDeviceSection" style="
  margin: 14px;
  padding: 12px;
  border: 1px solid #334155;
  border-radius: 8px;
">
  <div style="font-weight: 600; margin-bottom: 6px;">
    Register This Device
  </div>

  <input
    id="deviceNameInput"
    type="text"
    maxlength="80"
    placeholder="Example: Gaming PC"
    autocomplete="off"
    style="
      width: 100%;
      box-sizing: border-box;
      padding: 8px;
      margin-bottom: 8px;
    "
  />

  <button
    id="createDeviceButton"
    type="button"
    style="
      width: 100%;
      padding: 8px;
      cursor: pointer;
    "
  >
    Create This Device
  </button>

  <div
    id="createDeviceStatus"
    style="
      margin-top: 8px;
      font-size: 12px;
    "
  ></div>

  <div
    id="generatedPairCode"
    style="
      display: none;
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
    "
  ></div>
</div>
    
    <div id="devicePairSection" style="
  margin: 14px;
  padding: 12px;
  border: 1px solid #334155;
  border-radius: 8px;
">
  <div style="font-weight: 600; margin-bottom: 6px;">
    Device Connection
  </div>

  <div
    id="linkedDeviceInfo"
    style="
      display: none;
      font-size: 12px;
      margin-bottom: 8px;
    "
  ></div>
   
    <button id="generatePairCodeButton" type="button" style="
  width: 100%;
  padding: 8px;
  margin-top: 8px;
  cursor: pointer;
  display: none;
">
  Generate Pairing Code
</button>

<div id="newPairCodeDisplay" style="
  display: none;
  margin-top: 8px;
  font-size: 12px;
  font-weight: 600;
"></div>

  <div id="devicePairForm">
    <input
      id="devicePairCode"
      type="text"
      maxlength="8"
      placeholder="Enter 8-character device code"
      autocomplete="off"
      style="
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-bottom: 8px;
      "
    />

    <button
      id="linkDeviceButton"
      type="button"
      style="
        width: 100%;
        padding: 8px;
        cursor: pointer;
      "
    >
      Link This Browser
    </button>
  </div>

  <div
    id="devicePairStatus"
    style="
      margin-top: 8px;
      font-size: 12px;
    "
  ></div>
</div>

    <script src="popup.js"></script>
  </body>
</html>
